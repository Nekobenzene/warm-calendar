name: warm_calendar
description: A local-first Chinese calendar and planner prototype.
publish_to: none
version: 0.7.2+13
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  lunar: ^1.7.8
  drift: ^2.30.0
  drift_flutter: ^0.3.1
  file_selector: ^1.1.0
  web: ^1.1.1
  flutter_local_notifications_windows: ^3.1.1
  window_manager: ^0.5.2
  tray_manager: 0.5.3
  http: ^1.6.0
  crypto: ^3.0.8
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  flutter_secure_storage: ^11.2.0
  workmanager: ^0.10.10
  path_provider: ^2.1.6
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/icons/app_icon.ico
    - assets/holidays/
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
